schema_version: aux10_step_count5_v3
inherits_primary_label_contract: teacher_label_v2.yaml
teacher_feature_source:
  source: difficulty_rating.features
  required_raw_fields: 18
auxiliary_features:
  step_count:
    type: ordinal_single_label
    source: legacy.step_count
    values: [1-2步, 3-5步, 6-8步, 9-12步, 12步以上]
    irreversible_legacy_value: 9步以上
    irreversible_legacy_policy: reject_and_rebuild_from_teacher_features_legacy18
compatibility:
  historical_v3_8000pair_step_count_values: [1-2步, 3-5步, 6-8步, 9步以上]
  historical_checkpoint_policy: evaluation_only_with_embedded_or_inferred_legacy_schema
  resume_into_five_bin_training: forbidden
